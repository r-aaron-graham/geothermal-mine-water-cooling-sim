name: Smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python scheduler.py > scheduler-actual.json
      - run: diff -u scheduler-results-v1.json scheduler-actual.json
      - name: Build container
        run: docker build --tag reviewer-smoke .
      - name: Verify container output
        run: |
          docker run --rm reviewer-smoke > container-results.json
          diff -u scheduler-results-v1.json container-results.json
